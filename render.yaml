services:
  - type: web
    name: btc-direction-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GCP_PROJECT_ID
        value: btc-pipeline-508622
      - key: BQ_LOCATION
        value: US
      # paste the full contents of the read-only service account key here
      # in the Render dashboard; never commit it
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false